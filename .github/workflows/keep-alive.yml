name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ]; then
            APP_URL="https://koenig-strides-wpn647aofdopamvcypcosu.streamlit.app"
          fi
          echo "Pinging $APP_URL"
          for attempt in 1 2 3; do
            http_code=$(curl -s -o /tmp/body.html -w "%{http_code}" \
                          --max-time 60 -L -A "GitHubActions-KeepAlive/1.0" \
                          "$APP_URL" || true)
            echo "Attempt $attempt: HTTP $http_code"
            if [ "$http_code" = "200" ] || [ "$http_code" = "303" ] || [ "$http_code" = "302" ]; then
              echo "App is awake."
              exit 0
            fi
            sleep 15
          done
          echo "App did not respond OK after 3 attempts."
          exit 1
